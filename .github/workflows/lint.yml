name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Merge Dependabot PRs for dev dependencies and GitHub Actions once lint passes.
  # DEPENDABOT_MERGE_TOKEN is a fine-grained PAT (Dependabot secret) that can change workflow files,
  # which GITHUB_TOKEN can't. Without it, Actions update PRs fail to merge and stay open.
  dependabot-merge:
    needs: lint
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
      - if: steps.metadata.outputs.dependency-type == 'direct:development' || steps.metadata.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge --merge --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
